<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="96" viewBox="0 0 1000 96" role="img" aria-label="03 — Technology Constellation">
<defs>
  <radialGradient id="light" cx="0" cy="0" r="0.5"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.10"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <clipPath id="cl"><rect width="1000" height="96" rx="16"/></clipPath>
</defs>
<g clip-path="url(#cl)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif">
  <rect width="1000" height="96" fill="#0b1120"/>
  <rect width="1000" height="96" fill="url(#light)"/>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.9s" fill="freeze"/>
    <text x="36" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#7dd3fc" fill-opacity="0.85">03</text>
