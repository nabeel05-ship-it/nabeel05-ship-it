<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" role="img" aria-label="02 — Featured Projects">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <linearGradient id="num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0.15"/></linearGradient>
  <radialGradient id="dot"><stop offset="0" stop-color="#fff"/><stop offset="0.4" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <radialGradient id="hg" cx="0.05" cy="0.2" r="0.6"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <clipPath id="cl"><rect width="1000" height="120" rx="20"/></clipPath>
</defs>
<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" clip-path="url(#cl)">
  <rect width="1000" height="120" fill="#0b1120"/><rect width="1000" height="120" fill="url(#hg)"/>
  <text x="22" y="90" font-size="84" font-weight="900" fill="none" stroke="url(#num)" stroke-width="2" letter-spacing="-2">02
    <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/></text>
  <rect x="142" y="20" width="44" height="44" rx="12" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.6"/>
  <text x="164" y="50" text-anchor="middle" font-size="22">✨</text>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-16 0" to="0 0" begin="0.1s" dur="0.7s" fill="freeze"/>
    <text x="202" y="54" font-size="32" font-weight="800" fill="#f8fafc" letter-spacing="0.5">Featured Projects</text>
  </g>
  <text x="144" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#64748b" opacity="0">// shipped products with live demos
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.7s" fill="freeze"/></text>
  <rect x="0" y="115" width="0" height="5" fill="url(#g)"><animate attributeName="width" from="0" to="1000" begin="0.3s" dur="1.2s" fill="freeze"/></rect>
  <circle cy="116" r="8" fill="url(#dot)"><animate attributeName="cx" values="0;1000;0" dur="6s" begin="1.5s" repeatCount="indefinite"/></circle>
</g>
<rect x="1" y="1" width="998" height="118" rx="19" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>