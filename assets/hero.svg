<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Nabeel Sarosh Ahmed — AI • Full-Stack • Impact-Driven Builder">
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#94a3b8"/></pattern>
  <radialGradient id="fade" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#fff" stop-opacity="0.5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="m"><rect width="1000" height="260" fill="url(#fade)"/></mask>
  <radialGradient id="light" cx="0.5" cy="0" r="0.55"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.12"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <linearGradient id="rule" x1="0" x2="1"><stop offset="0" stop-color="#94a3b8" stop-opacity="0"/><stop offset="0.5" stop-color="#94a3b8" stop-opacity="0.7"/><stop offset="1" stop-color="#94a3b8" stop-opacity="0"/></linearGradient>
  <clipPath id="cl"><rect width="1000" height="260" rx="20"/></clipPath>
</defs>
<g clip-path="url(#cl)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" text-anchor="middle">
  <rect width="1000" height="260" fill="#0b1120"/>
  <rect width="1000" height="260" fill="url(#dots)" opacity="0.18" mask="url(#m)"/>
  <rect width="1000" height="260" fill="url(#light)"><animate attributeName="opacity" values="0.7;1;0.7" dur="8s" repeatCount="indefinite"/></rect>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="1s" fill="freeze"/>
    <circle cx="418" cy="58" r="3.5" fill="#22c55e"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="506" y="62" font-size="12" font-weight="500" letter-spacing="2" fill="#94a3b8">BUILDING IN PUBLIC</text>
  </g>

  <text x="500" y="130" font-size="50" font-weight="700" letter-spacing="1" fill="#f8fafc" opacity="0">Nabeel Sarosh Ahmed
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="1.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.3s" dur="1.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
  </text>

  <rect x="440" y="154" width="120" height="1" fill="url(#rule)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="1s" fill="freeze"/></rect>

  <text x="500" y="186" font-size="14" font-weight="500" letter-spacing="4" fill="#cbd5e1" opacity="0">AI  ·  FULL-STACK  ·  IMPACT-DRIVEN BUILDER
    <animate attributeName="opacity" from="0" to="1" begin="1s" dur="1s" fill="freeze"/>
  </text>
  <text x="500" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#64748b" opacity="0">Second-Year CSE Student
    <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="1s" fill="freeze"/>
  </text>
</g>
<rect x="0.5" y="0.5" width="999" height="259" rx="19.5" fill="none" stroke="#1e293b"/>
</svg>
