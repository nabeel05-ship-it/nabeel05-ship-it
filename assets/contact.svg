<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="208" viewBox="0 0 1000 208" role="img" aria-label="Got an ambitious idea? I'd love to connect and explore it together.">
<defs>
  <radialGradient id="light" cx="1" cy="0" r="0.55"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.08"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <clipPath id="cl"><rect width="1000" height="208" rx="18"/></clipPath>
</defs>
<g clip-path="url(#cl)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif">
  <rect width="1000" height="208" fill="#0b1120"/>
  <rect width="1000" height="208" fill="url(#light)"/>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.10s" dur="0.9s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.10s" dur="0.9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
  <text x="44" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#7dd3fc" fill-opacity="0.9">READY WHEN YOU ARE</text>
  <text x="44" y="100" font-size="32" font-weight="600" fill="#f1f5f9">Got an ambitious idea?</text>
  <text x="44" y="136" font-size="15" fill="#94a3b8">AI products · accessibility initiatives · social-impact platforms · ambitious full-stack ideas.</text>
  <text x="44" y="160" font-size="15" fill="#94a3b8">I'd love to connect and explore it together.</text>
</g>
<g transform="translate(900 104)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.40s" dur="1s" fill="freeze"/>
  <circle r="40" fill="none" stroke="#1e293b"><animate attributeName="r" values="40;54;40" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0.2;0.9" dur="6s" repeatCount="indefinite"/></circle>
  <circle r="34" fill="#0f172a" stroke="#334155"/>
  <rect x="-14" y="-10" width="28" height="20" rx="3" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M-14 -8 L0 3 L14 -8" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round"/>
</g>
</g>
<rect x="0.5" y="0.5" width="999" height="207" rx="17.5" fill="none" stroke="#1e293b"/>
</svg>
