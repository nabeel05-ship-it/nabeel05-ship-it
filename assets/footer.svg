<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-label="Thanks for stopping by. Let's build something that matters.">
<defs>
  <radialGradient id="light" cx="0.5" cy="1" r="0.55"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.08"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <clipPath id="cl"><rect width="1000" height="110" rx="16"/></clipPath>
</defs>
<g clip-path="url(#cl)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif">
  <rect width="1000" height="110" fill="#0b1120"/>
  <rect width="1000" height="110" fill="url(#light)"/>
  <g text-anchor="middle" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.10s" dur="1s" fill="freeze"/>
  <text x="500" y="50" font-size="17" font-weight="500" fill="#cbd5e1">Thanks for stopping by</text>
  <text x="500" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#64748b">Let's build something that matters.<tspan fill="#7dd3fc"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>▌</tspan></text>
</g>
</g>
<rect x="0.5" y="0.5" width="999" height="109" rx="15.5" fill="none" stroke="#1e293b"/>
</svg>
